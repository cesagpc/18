<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

	<title>Monkey Bake!</title>
</head>

<body>
	<style>
		*{
			margin: 0;
			padding: 0;
		}

		body{
			margin: 0;
			padding: 0;
			background-color: #FEEAC9;
			background-image: url(dots_bg.png);
		}

		input::-webkit-outer-spin-button,
		input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		.headers1{
			font-family: "Press Start 2P", system-ui;
			font-size: 2vw;
		}

		/*MAIN_SCREEN*/

		#main_screen_bottom{
			text-align: center;
		}

		#main_screen_bottom img{
			height: 10vw;
			margin: 0vw 8vw 0vw 8vw;
		}

		#main_title{
			display: grid;
			place-items: center;
		}

		#main_title img{
			height: 18vw;
		}

		#main_screen button{
			font-family: "Press Start 2P", system-ui;
			padding: 2vw;
			margin: 3vw;
			width: 20vw;
			border: none;
			border-radius: 4vw;
			background-color: #FDACAC;
			font-size: 2vw;
		}

		#main_screen button:hover {
			cursor: pointer;
			background-color: #FDACAC;
			color: wheat;
			border: solid 0.3vw #FD7979;
		}

		/*AGE_SCREEN*/

		#age_select_scr{
			display: none;
			place-items: center;
			margin: 2vw;
		}

		#age_select_scr input{
			height: 6vw;
			margin: 3vw 0 0 0vw;
			width: 15vw;
			border-radius: 1vw;
			border: solid pink;
			text-align: center;
			font-size: 3vw;
			font-family: 'Press Start 2P';
		}

		#age_select_scr button{
			padding: 1vw;
			border-radius: 1vw;
			border: solid #FD7979;
			background-color: #FDACAC;
			font-family: 'Press Start 2P';
			font-size: 3vw;
		}

		#age_select_scr button:hover {
			cursor: pointer;
			background-color: #FDACAC;
			color: wheat;
			border: solid #FD7979;
		}

		#age_select_scr button:focus {
			border: solid #FD7979;
		}

		/*FROSTING_SCREEN*/

		#frosting_select_scr{
			display: none;
			flex-direction: column;
			align-items: center;
			text-align: center;
			margin: 3vw;
		}

		#frostings_container{
			justify-content: center;
		}

		#frosting_select_scr img{
			height: 5vw;
			text-align: center;
			margin: 2vw;
			padding: 3vw;
			background: #FDACAC;
			border: solid #FDACAC;
			border-radius: 2vw;
		}

		#frosting_select_scr img:hover{
			cursor: pointer;
			background-color: #FDACAC;
			color: wheat;
			border: solid #FD7979;
		}

		#frostins_container div {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}

		#frostings_container h1 {
			font-size: 0.8vw;
			font-family: 'Press Start 2P';
		}

		/*BAKING_SCREEN*/

		#baking_screen{
			display: none;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}
		#baking_screen h1{
			margin: 3vw;
		}

		#baking_screen img{
			height: 20vw;
		}

		#baking_screen button{
			display: none;
			margin: 2vw;
			padding: 1vw;
			border-radius: 1vw;
			border: solid #FD7979;
			background-color: #FDACAC;
			font-family: 'Press Start 2P';
			font-size: 3vw;
		}

		#baking_screen button:hover {
			cursor: pointer;
			background-color: #FDACAC;
			color: wheat;
			border: solid #FD7979;
		}

		/*CAKE_SCREEN*/

		#cake_screen{
			display: none;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}

		#final_cake{
			height: 20vw;
		}

		#final_cake:hover{
			cursor: pointer;
		}

		#final_cake:active {
			height: 19.5vw;
		}

	</style>

	<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 165">
		<path fill="#FD7979" fill-opacity="1"
			d="M0,64L80,90.7C160,117,320,171,480,165.3C640,160,800,96,960,85.3C1120,75,1280,117,1360,138.7L1440,160L1440,0L1360,0C1280,0,1120,0,960,0C800,0,640,0,480,0C320,0,160,0,80,0L0,0Z">
		</path>
	</svg>

	<div id="main_screen">
		<div id="main_title">
			<img src="main_title.png" alt="">
		</div>

		<div id="main_screen_bottom">
			<img id="monke1_main_screen" src="monke1_main_screen.png" alt="">
			<button onclick="startGame()">JUGAR</button>
			<img id="monke2_main_screen" src="monke2_main_screen.png" alt="">
		</div>
	</div>

	<div id="age_select_scr">
		<h1 class="headers1">¿Cuántos años cumples?</h1>

		<div>
			<button onclick="age(-1)">-</button>
			<input readonly id="age_input" type="number" min="1" max="99">
			<button onclick="age(1)">+</button>
		</div>

		<button style="margin: 3vw;" onclick="frosting_scr()">Hornear!</button>
	</div>

	<div id="frosting_select_scr">
		<h1 class="headers1">Elige el sabor</h1>

		<div id="frostings_container">
			<div data-flavor="chocolate" onclick="chooseFrosting(this)">
				<img src="frosting/chocolate_fudge.png" alt="">
				<h1>Chocolate</h1>
			</div>

			<div data-flavor="cookies" onclick="chooseFrosting(this)">
				<img src="frosting/cookies_n_cream.png" alt="">
				<h1>Cookies n' cream</h1>
			</div>

			<div data-flavor="cream" onclick="chooseFrosting(this)">
				<img src="frosting/cream_cheese.png" alt="">
				<h1>3 leches</h1>
			</div>

			<div data-flavor="reeses" onclick="chooseFrosting(this)">
				<img src="frosting/peanut_butter.png" alt="">
				<h1>Reese's</h1>
			</div>

			<div data-flavor="strawberry" onclick="chooseFrosting(this)">
				<img src="frosting/strawberry.png" alt="">
				<h1>Fresa</h1>
			</div>

			<div data-flavor="vanilla" onclick="chooseFrosting(this)">
				<img src="frosting/vanilla_buttercream.png" alt="">
				<h1>Vainilla</h1>
			</div>
		</div>
	</div>

	<div id="baking_screen">
		<h1 class="headers1" id="baking_done_h1">
			Horneando...
		</h1>

		<img src="ovens/oven1.png" id="oven_image" alt="">

		<button id="bring_out_btn" onclick="bringCakeOut()">
			Sacar del horno
		</button>
	</div>

	<div id="cake_screen">
		<h1 id="cake_ready_header" class="headers1"></h1>

		<img id="final_cake" src="" onclick="changeDeco()">

		<p style='font-size: 1vw; font-family: "Press Start 2P", system-ui;'>Da click en el pastel para cambiar la decoración</p>
	</div>

	<script>
		function startGame() {
			const main_screen = document.getElementById("main_screen");
			const age_select_scr = document.getElementById("age_select_scr");

			main_screen.style.display = "none";
			age_select_scr.style.display = "grid";

		}

		let edad = 1;

		function age(x) {
			const input = document.getElementById("age_input")
			let value = parseInt(input.value, 10) || 0;
			const min = parseInt(input.min, 10);
			const max = parseInt(input.max, 10);
			value = Math.min(max, Math.max(min, value + x));
			input.value = value;

			edad = value;
		}

		/******************************Frosting screen************************************/

		function frosting_scr() {
			console.log(edad)


			const age_select_scr = document.getElementById("age_select_scr");
			const frosting_select_scr = document.getElementById("frosting_select_scr");
			const frostings_container = document.getElementById("frostings_container");

			age_select_scr.style.display = "none";
			frosting_select_scr.style.display = "flex";
			frostings_container.style.display = "flex";
		}

		let flavor = null;

		/******************************Baking screen************************************/

		function chooseFrosting(x) {
			flavor = x.dataset.flavor;

			const frosting_select_scr = document.getElementById("frosting_select_scr");
			const baking_scr = document.getElementById("baking_screen");

			frosting_select_scr.style.display = "none";
			baking_scr.style.display = "flex";

			/*Oven changes*/
			let ovens = ['ovens/oven1.png', 'ovens/oven2.png', 'ovens/oven3.png', 'ovens/oven4.png'];

			let index = 0;
			let contador = 0;
			const imgElement = document.querySelector('#oven_image');

			function change() {
				imgElement.src = ovens[index];
				if (index > 2) {
					index = 0;
				} else {
					index++;
				}

				contador++;

				if (contador >= 6) {
					const baking_done_h1 = document.getElementById("baking_done_h1");
					const bring_out_btn = document.getElementById("bring_out_btn");


					clearInterval(intervalo)
					baking_done_h1.textContent = "LISTO!";
					bring_out_btn.style.display = "block";
				}
			}

			const intervalo = setInterval(change, 1000);
		}

		/******************************Cake screen************************************/

		function bringCakeOut() {
			const cake_ready_header = document.getElementById("cake_ready_header");

			if (edad == 1) {
				cake_ready_header.textContent = `¡Listo! \nFeliz ${edad} año mi amor 🐒❤️🐒`;
			} else {
				cake_ready_header.textContent = `¡Listo! \nFelices ${edad} años mi amor 🐒❤️🐒`;
			}

			const baking_screen = document.getElementById("baking_screen");
			const cake_screen = document.getElementById("cake_screen");

			const final_cake = document.getElementById("final_cake");

			baking_screen.style.display = "none";
			cake_screen.style.display = "flex";

			if (flavor == "chocolate") {
				final_cake.src = "cake/chocolate/1.png";
			} else if (flavor == "cookies") {
				final_cake.src = "cake/cookies/1.png";
			} else if (flavor == "cream") {
				final_cake.src = "cake/cream/1.png";
			} else if (flavor == "reeses") {
				final_cake.src = "cake/reeses/1.png";
			} else if (flavor == "strawberry") {
				final_cake.src = "cake/strawberry/1.png";
			} else if (flavor == "vanilla") {
				final_cake.src = "cake/vanilla/1.png";
			}
		}


		let currentNumber = 1;

		function changeDeco() {
			const totalImages = 6;

			const final_cake = document.getElementById("final_cake");

			if (currentNumber < totalImages) {
				currentNumber++;
				final_cake.src = `cake/${flavor}/${currentNumber}.png`;
			} else {
				currentNumber = 1; // Loop back to the first image
				final_cake.src = `cake/${flavor}/${currentNumber}.png`;
			}
		}

	</script>
</body>

</html>
